[project]
name = "transcript-assistant"
version = "0.1.0"
description = "Record any meeting that plays through this computer and transcribe it locally on the GPU."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "soundcard>=0.4.3",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
transcript-assistant = "transcript_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
