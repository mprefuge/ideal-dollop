[project]
name = "transcript-assistant"
version = "0.4.0"
description = "Record any meeting that plays through this computer and transcribe it locally on the GPU."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "soundcard>=0.4.3",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.1",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
diarize = ["pyannote.audio>=3.1", "torch>=2.1"]

[project.scripts]
transcript-assistant = "transcript_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
